name: Release

# A pushed tag like v1.2.3 releases it. "Run workflow" in the Actions tab with a tag tags the
# chosen branch's newest commit and releases it, for when a tag can't be pushed from where you are.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'The version to tag and release, such as v1.2.3'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # a tag pushed by this job's token doesn't start another run, so this run releases it
      - name: Tag the release
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::the tag must look like v1.2.3, got '$TAG'"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists"
            exit 1
          fi
          git tag "$TAG"
          git push origin "refs/tags/$TAG"

      - uses: actions/setup-go@v4
        with:
          go-version: '1.27'

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
