version: 2

project_name: gorun

before:
  hooks:
    - go mod tidy

builds:
  - id: gorun
    main: ./cmd
    binary: gorun
    ldflags:
      - -s -w -X main.version={{.Tag}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

  - id: gorun-otel
    main: ./cmd
    binary: gorun-otel
    tool: ./scripts/go-otel.sh
    ldflags:
      - -s -w -X main.version={{.Tag}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64

archives:
  - id: gorun
    ids:
      - gorun
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
  - id: gorun-otel
    ids:
      - gorun-otel
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}-otel_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

release:
  prerelease: auto
