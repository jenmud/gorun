version: '3.8'

services:
  ssh-server-1:
    image: linuxserver/openssh-server
    container_name: ssh-server-1
    environment:
      - PUID=1000
      - PGID=1000
      - USER_NAME=testuser
      - USER_PASSWORD=testpassword
      - PASSWORD_ACCESS=1
      - PUBLIC_KEY_FILE=/config/ssh/keys/id_rsa.pub
    volumes:
      - ./ssh-keys:/config/ssh/keys
      - ./test-scripts:/test-scripts
      - ./custom-ssh-config:/config/sshd/sshd_config
    ports:
      - "2221:22"
    networks:
      - gorun-network
    restart: unless-stopped

  ssh-server-2:
    image: linuxserver/openssh-server
    container_name: ssh-server-2
    environment:
      - PUID=1000
      - PGID=1000
      - USER_NAME=testuser
      - USER_PASSWORD=testpassword
      - PASSWORD_ACCESS=1
      - PUBLIC_KEY_FILE=/config/ssh/keys/id_rsa.pub
    volumes:
      - ./ssh-keys:/config/ssh/keys
      - ./test-scripts:/test-scripts
      - ./custom-ssh-config:/config/sshd/sshd_config
    ports:
      - "2222:22"
    networks:
      - gorun-network
    restart: unless-stopped

networks:
  gorun-network:
    driver: bridge