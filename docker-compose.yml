services:
  ssh-server-1:
    image: lscr.io/linuxserver/openssh-server:latest
    container_name: ssh-server-1
    hostname: ssh-server-1
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - PUBLIC_KEY_DIR=/ssh-keys
      - SUDO_ACCESS=false
      - PASSWORD_ACCESS=true
      - USER_NAME=testuser
      - USER_PASSWORD=testpassword
    volumes:
      - ./ssh-keys:/ssh-keys:ro
      - ./test-scripts:/test-scripts
    ports:
      - 2221:2222
    restart: unless-stopped
    networks:
      - gorun-network

  ssh-server-2:
    image: lscr.io/linuxserver/openssh-server:latest
    container_name: ssh-server-2
    hostname: ssh-server-2
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - PUBLIC_KEY_DIR=/ssh-keys
      - SUDO_ACCESS=false
      - PASSWORD_ACCESS=true
      - USER_NAME=testuser
      - USER_PASSWORD=testpassword
    volumes:
      - ./ssh-keys:/ssh-keys:ro
      - ./test-scripts:/test-scripts
    ports:
      - 2222:2222
    restart: unless-stopped
    networks:
      - gorun-network

networks:
  gorun-network:
    driver: bridge
