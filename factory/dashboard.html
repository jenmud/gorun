<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gorun factory</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --ink: #1d2330; --muted: #6b7385; --line: #e3e6eb;
    --pass: #1f9d55; --pass-bg: #e3f6eb; --chg: #c2410c; --chg-bg: #fdeee4;
    --pend: #8a93a6; --pend-bg: #eef0f4; --human: #d97706; --human-bg: #fff7e6; --accent: #3056d3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1b2029; --ink: #e6e9ef; --muted: #8d96a8; --line: #2a303b;
      --pass: #4ade80; --pass-bg: #163222; --chg: #fb923c; --chg-bg: #3a2216;
      --pend: #8d96a8; --pend-bg: #232934; --human: #fbbf24; --human-bg: #2f2612; --accent: #7c9cff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: baseline; gap: 12px; padding: 18px 24px 6px; }
  h1 { font-size: 18px; margin: 0; }
  .sub { color: var(--muted); font-size: 12px; }
  .loop { color: var(--muted); font: 12px ui-monospace, monospace; padding: 0 24px 14px; }
  .board { display: grid; grid-template-columns: repeat(6, minmax(190px, 1fr)); gap: 12px;
           padding: 0 24px 24px; overflow-x: auto; }
  .col h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
            margin: 0 0 8px; display: flex; justify-content: space-between; }
  .col { min-height: 120px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
          margin-bottom: 10px; cursor: pointer; transition: transform .1s, box-shadow .1s; }
  .card:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0,0,0,.08); }
  .card.human { border: 2px solid var(--human); background: var(--human-bg); }
  .card .id { font: 11px ui-monospace, monospace; color: var(--muted); }
  .card .title { font-weight: 600; margin: 2px 0 6px; }
  .note { font-size: 12px; color: var(--human); font-weight: 600; margin-bottom: 6px; }
  .round { display: flex; align-items: center; gap: 4px; margin-top: 4px; }
  .round .n { font: 10px ui-monospace, monospace; color: var(--muted); width: 18px; }
  .chip { font-size: 10px; padding: 1px 6px; border-radius: 999px; background: var(--pend-bg); color: var(--pend); }
  .chip.PASS { background: var(--pass-bg); color: var(--pass); }
  .chip.CHANGES { background: var(--chg-bg); color: var(--chg); font-weight: 600; }
  .chip.pending::after { content: "…"; }
  .meta { font-size: 11px; color: var(--muted); margin-top: 6px; display: flex; justify-content: space-between; }
  .empty { color: var(--muted); font-size: 12px; border: 1px dashed var(--line); border-radius: 10px; padding: 14px; text-align: center; }
  aside { position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 100%); background: var(--card);
          border-left: 1px solid var(--line); box-shadow: -8px 0 30px rgba(0,0,0,.12);
          transform: translateX(100%); transition: transform .2s; display: flex; flex-direction: column; }
  aside.open { transform: none; }
  aside .top { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  aside button.x { border: 0; background: none; color: var(--muted); font-size: 22px; cursor: pointer; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 18px; border-bottom: 1px solid var(--line); }
  .tabs button { font: 12px ui-monospace, monospace; border: 1px solid var(--line); background: none; color: var(--ink);
                 border-radius: 6px; padding: 3px 8px; cursor: pointer; }
  .tabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .doc { padding: 16px 22px 40px; overflow-y: auto; }
  .doc h1, .doc h2, .doc h3 { margin: 1em 0 .4em; line-height: 1.25; }
  .doc h1 { font-size: 18px; } .doc h2 { font-size: 15px; } .doc h3 { font-size: 14px; }
  .doc pre { background: var(--bg); padding: 10px; border-radius: 6px; overflow-x: auto; font-size: 12px; }
  .doc code { font: 12px ui-monospace, monospace; background: var(--bg); padding: 1px 4px; border-radius: 4px; }
  .doc pre code { background: none; padding: 0; }
  .doc .v-PASS, .doc .v-APPROVE { color: var(--pass); font-weight: 700; }
  .doc .v-CHANGES, .doc .v-ESCALATE { color: var(--chg); font-weight: 700; }
  @media (max-width: 700px) { .board { grid-template-columns: repeat(6, 80vw); padding: 0 16px 16px; }
                              header, .loop { padding-left: 16px; padding-right: 16px; } }
</style>
</head>
<body>
<header><h1>gorun factory</h1><span class="sub" id="status">loading…</span></header>
<div class="loop">feature → spec → build → [security · ux · ui · code] → approve → merged / needs-human</div>
<main class="board" id="board"></main>
<aside id="panel">
  <div class="top"><div><div class="id" id="p-id"></div><strong id="p-title"></strong></div>
    <button class="x" onclick="closePanel()" aria-label="Close">×</button></div>
  <div class="tabs" id="tabs"></div>
  <div class="doc" id="doc"></div>
</aside>
<script>
const STAGES = [["spec","Spec"],["build","Build"],["review","Review"],["approve","Approve"],["needs-human","Needs human"],["merged","Merged"]];
const REVIEWERS = ["security","ux","ui","code"];
const DEMO = location.search.includes("demo");
let board = {jobs: []}, openJob = null;

const DEMO_BOARD = {jobs: [
  {id:"001-plain-summary", title:"Summary line for -plain runs", branch:"factory/001-plain-summary", stage:"merged", round:1,
   reviews:{security:"PASS",ux:"PASS",ui:"PASS",code:"PASS"}, rounds:[], decision:"APPROVE", updated:"2026-11-12T09:12:00Z"},
  {id:"002-group-timeout", title:"Timeout for a server group", branch:"factory/002-group-timeout", stage:"needs-human", round:2,
   reviews:{security:"PASS",ux:"PASS",ui:"PASS",code:"PASS"}, rounds:[{security:"PASS",ux:"CHANGES",ui:"PASS",code:"CHANGES"}],
   decision:"ESCALATE", note:"Changes how task timeouts inherit — breaking?", updated:"2026-11-12T10:40:00Z"},
  {id:"003-rate-limiting", title:"Rate limit the web API", branch:"factory/003-rate-limiting", stage:"review", round:2,
   reviews:{security:"CHANGES",ux:"PASS",ui:"pending",code:"PASS"}, rounds:[{security:"CHANGES",ux:"PASS",ui:"PASS",code:"CHANGES"}],
   decision:null, updated:"2026-11-12T11:02:00Z"},
  {id:"004-status-filter", title:"Filter runs by task status", branch:"factory/004-status-filter", stage:"build", round:1,
   reviews:{}, rounds:[], decision:null, updated:"2026-11-12T11:05:00Z"},
]};

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ago = t => { if (!t) return ""; const m = Math.round((Date.now() - new Date(t)) / 60000);
  return m < 1 ? "just now" : m < 60 ? m + "m ago" : m < 1440 ? Math.round(m/60) + "h ago" : Math.round(m/1440) + "d ago"; };

function chips(n, reviews) {
  return `<div class="round"><span class="n">R${n}</span>` +
    REVIEWERS.map(r => { const v = (reviews || {})[r] || "pending";
      return `<span class="chip ${esc(v)}" title="${r}: ${esc(v)}">${r}</span>`; }).join("") + `</div>`;
}

function card(j) {
  const human = j.stage === "needs-human";
  const rounds = (j.rounds || []).map((r, i) => chips(i + 1, r)).join("");
  const showCurrent = j.stage === "review" || Object.keys(j.reviews || {}).length;
  const current = showCurrent ? chips(j.round || (j.rounds || []).length + 1, j.reviews) : "";
  return `<div class="card ${human ? "human" : ""}" data-id="${esc(j.id)}">
    <div class="id">${esc(j.id)}</div><div class="title">${esc(j.title || j.id)}</div>
    ${human && j.note ? `<div class="note">⚑ ${esc(j.note)}</div>` : ""}
    ${rounds}${current}
    <div class="meta"><span>${j.decision ? esc(j.decision) : (j.round ? "round " + j.round : "")}</span><span>${ago(j.updated)}</span></div>
  </div>`;
}

function render() {
  const el = document.getElementById("board");
  el.innerHTML = STAGES.map(([key, label]) => {
    const jobs = board.jobs.filter(j => j.stage === key);
    return `<section class="col"><h2><span>${label}</span><span>${jobs.length || ""}</span></h2>
      ${jobs.map(card).join("") || `<div class="empty">—</div>`}</section>`;
  }).join("");
  el.querySelectorAll(".card").forEach(c => c.onclick = () => openPanel(c.dataset.id));
}

async function poll() {
  try {
    if (DEMO) board = DEMO_BOARD;
    else { const r = await fetch("board.json", {cache: "no-store"}); if (!r.ok) throw new Error(r.status); board = await r.json(); }
    board.jobs = board.jobs || [];
    document.getElementById("status").textContent =
      (DEMO ? "demo data · " : "") + board.jobs.length + " jobs · updated " + new Date().toLocaleTimeString();
    render();
  } catch (e) {
    document.getElementById("status").textContent = "can't read board.json (" + e.message + "). Serve factory/ with python3 -m http.server";
  }
}

// --- job files ----------------------------------------------------------------
function filesFor(j) {
  const f = ["feature.md", "spec.md", "build.md"];
  const n = Math.max(j.round || 0, (j.rounds || []).length + 1);
  for (let i = 1; i <= n; i++) for (const r of [...REVIEWERS, "human"]) f.push(`round-${i}/review-${r}.md`);
  f.push("decision.md");
  return f;
}

async function openPanel(id) {
  const j = board.jobs.find(x => x.id === id); if (!j) return;
  openJob = id;
  document.getElementById("p-id").textContent = j.id + " · " + (j.branch || "");
  document.getElementById("p-title").textContent = j.title || j.id;
  document.getElementById("panel").classList.add("open");
  const tabs = document.getElementById("tabs"), doc = document.getElementById("doc");
  tabs.innerHTML = ""; doc.innerHTML = `<p class="sub">loading files…</p>`;
  if (DEMO) { doc.innerHTML = `<p class="sub">Demo data has no files. Run a real job to read its markdown here.</p>`; return; }
  const found = (await Promise.all(filesFor(j).map(async p => {
    try { const r = await fetch(`jobs/${encodeURIComponent(j.id)}/${p}`, {cache: "no-store"});
          return r.ok ? [p, await r.text()] : null; } catch { return null; }
  }))).filter(Boolean);
  if (openJob !== id) return;
  if (!found.length) { doc.innerHTML = `<p class="sub">No files yet.</p>`; return; }
  const show = i => { tabs.querySelectorAll("button").forEach((b, k) => b.classList.toggle("on", k === i));
                      doc.innerHTML = md(found[i][1]); doc.scrollTop = 0; };
  tabs.innerHTML = found.map(([p]) => `<button>${esc(p)}</button>`).join("");
  tabs.querySelectorAll("button").forEach((b, i) => b.onclick = () => show(i));
  show(found.length - 1);
}
function closePanel() { openJob = null; document.getElementById("panel").classList.remove("open"); }
document.addEventListener("keydown", e => { if (e.key === "Escape") closePanel(); });

// --- a small markdown renderer: headings, lists, code, bold, inline code, verdict lines --------------
function inline(s) {
  return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
}
function md(text) {
  const out = [], lines = text.replace(/\r/g, "").split("\n");
  let list = false, code = null;
  const endList = () => { if (list) { out.push("</ul>"); list = false; } };
  for (const line of lines) {
    if (code !== null) {
      if (line.startsWith("```")) { out.push(`<pre><code>${esc(code.join("\n"))}</code></pre>`); code = null; }
      else code.push(line);
      continue;
    }
    if (line.startsWith("```")) { endList(); code = []; continue; }
    const v = line.match(/^(?:VERDICT: )?(PASS|CHANGES|APPROVE|ESCALATE)\b(.*)$/);
    const h = line.match(/^(#{1,3})\s+(.*)$/);
    const li = line.match(/^\s*[-*]\s+(.*)$/);
    if (v && out.length === 0) out.push(`<p class="v-${v[1]}">${esc(line)}</p>`);
    else if (h) { endList(); out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); }
    else if (li) { if (!list) { out.push("<ul>"); list = true; } out.push(`<li>${inline(li[1])}</li>`); }
    else if (line.trim() === "") endList();
    else { endList(); out.push(`<p>${inline(line)}</p>`); }
  }
  if (code !== null) out.push(`<pre><code>${esc(code.join("\n"))}</code></pre>`);
  endList();
  return out.join("\n");
}

poll(); setInterval(poll, 3000);
</script>
</body>
</html>
