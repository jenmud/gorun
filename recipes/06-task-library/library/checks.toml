# A shared task library: tasks and bundles only, written once and included from any Gorunfile.
# A library task's paths are relative to the root of the repository it lives in. This library
# sits inside the gorun repository, so its script path starts with recipes/; in a repository of
# its own it would be scripts/hello.sh.

[tasks.lib-hello]
description = "Say hello from the shared library"
cmd_file = "recipes/06-task-library/library/scripts/hello.sh"
local = true

[tasks.lib-uptime]
description = "Show how long this machine has been up"
cmd = "uptime"
local = true

[tasks.lib-disk]
description = "Show free space on the root filesystem"
cmd = "df -h /"
local = true
depends_on = ["lib-hello"]

# A library task can skip itself and confirm its change like any other: the check makes it
# unchanged once the file is there, and the verify fails it if the file didn't get written.
[tasks.lib-motd]
description = "Write a message of the day, once"
check = "test -s /tmp/gorun-library/motd"
cmd = "mkdir -p /tmp/gorun-library && echo 'managed by the shared task library' > /tmp/gorun-library/motd"
verify = "grep -q 'shared task library' /tmp/gorun-library/motd"
local = true

[bundles.lib-checks]
description = "Quick checks and a one-time setup step, from the shared library"
tasks = ["lib-hello", "lib-uptime", "lib-disk", "lib-motd"]
