# shared settings for every test SSH server
x-ssh-server: &ssh-server
  image: lscr.io/linuxserver/openssh-server:latest
  environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    - PUBLIC_KEY_DIR=/ssh-keys
    - SUDO_ACCESS=true
    - PASSWORD_ACCESS=true
    - USER_NAME=testuser
  volumes:
    - ./ssh-keys:/ssh-keys:ro
  restart: unless-stopped
  networks:
    - gorun-network

services:
  ssh-server-1:
    <<: *ssh-server
    container_name: gorun-ssh-server-1
    hostname: ssh-server-1
    ports:
