# ≈ roles/nginx
[tasks.nginx-install]
description = "Install nginx"
check = "dpkg-query -W -f='${Status}' nginx 2>/dev/null | grep -q 'install ok installed'"   # ≈ state: present
cmd = "apt-get install -y -q nginx"
verify = "nginx -v"
sudo = true

[tasks.nginx-reload]
description = "Reload nginx after a config change"
cmd = "systemctl reload nginx"
verify = "systemctl is-active --quiet nginx"   # the reload left nginx running
sudo = true

[bundles.nginx]
description = "Web server"
tasks = ["nginx-install", "nginx-reload"]
