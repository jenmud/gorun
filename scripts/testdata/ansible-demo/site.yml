---
# Roll out the demo fleet: common settings everywhere, then the web tier and the database.
- name: Common setup on every host
  hosts: app
  become: false
  vars_files:
    - vars/release.yml
  roles:
    - common

- name: Web tier
  hosts: web
  vars:
    web_tag: web-tier
  roles:
    - role: web
      tags: [web]
  tasks:
    - name: Show which release this host gets
      shell: echo "{{ inventory_hostname }} gets release {{ release }}"
      register: release_note

    - name: Create the release folder
      file:
        path: "{{ release_dir }}"
        state: directory
        mode: "0755"

    - include_tasks: tasks/verify.yml

- name: Database
  hosts: db
  roles:
    - db
