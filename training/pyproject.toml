[project]
name = "gorun-training"
version = "0"
description = "Fine-tunes the gorun assistant's model"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.9.1",
    "transformers==4.57.3",
    "peft==0.18.0",
    "trl==0.25.1",
    "bitsandbytes==0.48.2",
    "accelerate==1.12.0",
    "liger-kernel==0.6.4",
    "datasets==4.4.1",
    "sentencepiece",
    "gguf",
    "safetensors",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
