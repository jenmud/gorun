[[task]]
id = "go-tarball"
request = [
  "Install Go <<ver>> into /usr/local/go",
  "write a task that installs go <<ver>> from the go.dev tarball",
  "upgrade Go to <<ver>> on the build servers",
]
note = "This downloads the Go <<ver>> tarball from go.dev and replaces /usr/local/go with it. Its check skips it when that version is already there."
answer = '''
[tasks.golang]
description = "Install Go <<ver>> into /usr/local/go"
check = "/usr/local/go/bin/go version 2>/dev/null | grep -q 'go<<ver>> '"
