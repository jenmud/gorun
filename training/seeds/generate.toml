[[task]]
id = "github-release-exporter"
request = [
  "Install <<name>> <<ver>> from its GitHub release and run it with systemd",
  "write tasks that download <<name>> v<<ver>> and run it as a service",
]
note = "These are three small steps: <<name>>-install downloads the release binary, <<name>>-unit installs a systemd unit, and <<name>> starts it and checks it answers on port <<port>>."
answer = '''
[tasks.<<name>>-install]
description = "Install <<name>> <<ver>>"
check = "/usr/local/bin/<<name>> --version 2>&1 | grep -q '<<ver>>'"
cmd = "cd /tmp && curl -fsSLO https://github.com/prometheus/<<name>>/releases/download/v<<ver>>/<<name>>-<<ver>>.linux-amd64.tar.gz && tar -xzf <<name>>-<<ver>>.linux-amd64.tar.gz && install -m 755 <<name>>-<<ver>>.linux-amd64/<<name>> /usr/local/bin/<<name>>"
verify = "/usr/local/bin/<<name>> --version 2>&1 | grep -q '<<ver>>'"
sudo = true
retries = 2
rerun = "safe"

[tasks.<<name>>-unit]
description = "Install the <<name>> systemd unit"
depends_on = ["<<name>>-install"]
check = "systemctl cat <<name>> >/dev/null 2>&1"
cmd = "id <<name>> >/dev/null 2>&1 || useradd --system --no-create-home --shell /usr/sbin/nologin <<name>>; install -m 644 /tmp/<<name>>.service /etc/systemd/system/<<name>>.service && systemctl daemon-reload"
verify = "systemctl cat <<name>> >/dev/null"
check_copies = true
sudo = true
rerun = "safe"
[[tasks.<<name>>-unit.copy]]
content = "[Unit]\nDescription=<<name>>\nAfter=network-online.target\n\n[Service]\nUser=<<name>>\nExecStart=/usr/local/bin/<<name>>\nRestart=on-failure\n\n[Install]\nWantedBy=multi-user.target\n"
dst = "/tmp/<<name>>.service"

[tasks.<<name>>]
description = "Run <<name>> and keep it running"
depends_on = ["<<name>>-unit"]
check = "systemctl is-active --quiet <<name>> && systemctl is-enabled --quiet <<name>>"
cmd = "systemctl enable --now <<name>> && systemctl restart <<name>>"
verify = "curl -fsS http://127.0.0.1:<<port>>/metrics >/dev/null"
sudo = true
retries = 2
retry_delay = "5s"
rerun = "safe"
'''
