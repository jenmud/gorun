[[task]]
id = "github-release-binary"
request = [
  "Install <<bin>> from its latest GitHub release",
  "download the newest <<bin>> release from github into /usr/local/bin",
]
note = "This asks the GitHub API for the latest <<repo>> release, downloads the asset matching <<asset>>, and installs <<bin>> into /usr/local/bin. Its check skips it when <<bin>> is installed."
answer = '''
[tasks.<<bin>>]
description = "Install <<bin>> from its latest GitHub release"
check = "command -v <<bin>> >/dev/null"
cmd = """
set -e
url=$(curl -fsSL https://api.github.com/repos/<<repo>>/releases/latest | jq -r '[.assets[] | select(.name | test("<<asset>>"))][0].browser_download_url')
tmp=$(mktemp -d)
curl -fsSL "$url" -o "$tmp/asset"
case "$url" in *.tar.gz) tar -C "$tmp" -xzf "$tmp/asset" ;; *) mv "$tmp/asset" "$tmp/<<bin>>" ;; esac
install -m 755 "$(find "$tmp" -type f -name <<bin>> | head -n1)" /usr/local/bin/<<bin>>
rm -rf "$tmp"
"""
verify = "<<bin>> --version"
sudo = true
retries = 2
rerun = "safe"
'''
