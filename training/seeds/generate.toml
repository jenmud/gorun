[[task.params]]
days = "3"

[[task]]
id = "certbot"
request = [
  "Get a Let's Encrypt certificate for <<domain>>",
  "set up TLS for <<domain>> with certbot",
]
note = "Two small steps: certbot installs certbot's nginx plugin, then tls-<<name>> gets the certificate and sets up renewal; the check skips it once the certificate exists. Change the email."
answer = '''
[tasks.certbot]
description = "Install certbot with its nginx plugin"
check = "dpkg -s python3-certbot-nginx >/dev/null 2>&1"
cmd = "apt-get update && apt-get install -y certbot python3-certbot-nginx"
verify = "certbot --version"
sudo = true
rerun = "safe"

[tasks.tls-<<name>>]
description = "Get a Let's Encrypt certificate for <<domain>>"
depends_on = ["certbot"]
check = "test -f /etc/letsencrypt/live/<<domain>>/fullchain.pem"
cmd = "certbot --nginx -d <<domain>> --non-interactive --agree-tos -m admin@<<domain>>"
verify = "test -f /etc/letsencrypt/live/<<domain>>/fullchain.pem"
