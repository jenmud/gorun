[[task]]
id = "release-symlink"
request = [
  "Deploy version <<ver>> of <<app>>: unpack it into a releases folder and switch a current symlink",
  "write release tasks for <<app>> <<ver>> with a current symlink and a health check",
]
note = "These are three small steps: <<app>>-release unpacks the tarball into /srv/<<app>>/releases/<<ver>>, <<app>>-switch points current at it and restarts the service, and <<app>>-health waits for /healthz. Rolling back is switching current to the previous release."
answer = '''
[tasks.<<app>>-release]
description = "Unpack <<app>> <<ver>> into /srv/<<app>>/releases"
check = "test -d /srv/<<app>>/releases/<<ver>>"
cmd = "install -d /srv/<<app>>/releases/<<ver>> && tar -xzf /tmp/<<app>>.tar.gz -C /srv/<<app>>/releases/<<ver>>"
verify = "test -n \"$(ls -A /srv/<<app>>/releases/<<ver>>)\""
sudo = true
timeout = "10m"
rerun = "safe"
[[tasks.<<app>>-release.copy]]
src = "./dist/<<app>>-<<ver>>.tar.gz"
dst = "/tmp/<<app>>.tar.gz"

[tasks.<<app>>-switch]
description = "Point current at <<ver>> and restart <<app>>"
depends_on = ["<<app>>-release"]
check = "test \"$(readlink /srv/<<app>>/current)\" = /srv/<<app>>/releases/<<ver>>"
cmd = "ln -sfn /srv/<<app>>/releases/<<ver>> /srv/<<app>>/current && systemctl restart <<app>>"
verify = "systemctl is-active <<app>>"
sudo = true
rerun = "safe"

[tasks.<<app>>-health]
description = "Wait for <<app>> to answer on /healthz"
depends_on = ["<<app>>-switch"]
check = "curl -fsS --max-time 5 http://127.0.0.1:<<port>>/healthz >/dev/null"
cmd = "sleep 3"
verify = "curl -fsS --max-time 5 http://127.0.0.1:<<port>>/healthz"
retries = 6
retry_delay = "5s"
rerun = "safe"
'''
[[task.params]]
app = "payments"
ver = "2.15.0"
port = "8080"
[[task.params]]
app = "shop"
ver = "1.4.2"
port = "3000"

