[[task]]
id = "docker-apt-repo"
request = [
  "Install Docker from Docker's apt repository",
  "set up docker-ce from the official Docker apt repo, not get.docker.com",
  "Install Docker Engine with the compose plugin from download.docker.com",
]
note = "These are two small steps: docker-repo adds Docker's signed apt repository, then docker-engine installs Docker Engine with the buildx and compose plugins and starts it."
answer = '''
[tasks.docker-repo]
description = "Add Docker's apt repository"
check = "test -f /etc/apt/sources.list.d/docker.list && test -f /etc/apt/keyrings/docker.asc"
cmd = """
set -e
. /etc/os-release
install -m 0755 -d /etc/apt/keyrings
curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
chmod a+r /etc/apt/keyrings/docker.asc
echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu ${UBUNTU_CODENAME:-$VERSION_CODENAME} stable" > /etc/apt/sources.list.d/docker.list
"""
verify = "test -s /etc/apt/sources.list.d/docker.list"
sudo = true
rerun = "safe"

[tasks.docker-engine]
description = "Install Docker Engine and start it"
depends_on = ["docker-repo"]
check = "dpkg -s docker-ce docker-compose-plugin >/dev/null 2>&1 && systemctl is-active --quiet docker"
cmd = "apt-get update && apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin && systemctl enable --now docker"
verify = "systemctl is-active docker && docker compose version >/dev/null"
envvars = { DEBIAN_FRONTEND = "noninteractive" }
sudo = true
retries = 2
timeout = "15m"
rerun = "safe"
'''

[[task]]
id = "dir-backup-retention"
request = [
  "Back up <<dir>> to /var/backups/<<name>>-DATE.tar.gz and keep <<days>> days",
  "write a task that archives <<dir>> into /var/backups with the date in the name, deleting ones older than <<days>> days",
  "nightly tarball of <<dir>>, keep the last <<days>> days",
]
note = "This archives <<dir>> into /var/backups with today's date, then deletes archives older than <<days>> days. Its check skips it when today's archive is there; its verify makes sure the archive isn't empty."
answer = '''
[tasks.backup-<<name>>]
description = "Archive <<dir>> into /var/backups, keep <<days>> days"
check = "test -s /var/backups/<<name>>-$(date +%F).tar.gz"
cmd = "install -d -m 700 /var/backups && tar -czf /var/backups/<<name>>-$(date +%F).tar.gz <<dir>> && find /var/backups -name '<<name>>-*.tar.gz' -mtime +<<days>> -delete"
verify = "tar -tzf /var/backups/<<name>>-$(date +%F).tar.gz >/dev/null"
sudo = true
timeout = "30m"
rerun = "safe"
'''
[[task.params]]
