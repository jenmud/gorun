# A second OpenTelemetry collector that ships gorun's log file to the same backend.
receivers:
  filelog:
    include: [/gorun-logs/gorun.log]
    start_at: beginning
    operators:
      - type: regex_parser
        regex: 'level=(?P<level>\w+) msg="(?P<msg>[^"]*)"'
        severity:
          parse_from: attributes.level
        on_error: send
      - type: regex_parser
        parse_from: body
        regex: 'gorun_uuid=(?P<gorun_uuid>\S+)'
        on_error: send

processors:
  resource:
    attributes:
      - { key: service.name, value: gorun, action: upsert }

exporters:
  otlphttp:
    endpoint: http://127.0.0.1:4318

service:
  telemetry:
    metrics:
      level: none
  pipelines:
    logs:
      receivers: [filelog]
      processors: [resource]
      exporters: [otlphttp]
